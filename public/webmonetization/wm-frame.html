<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />

    <title>Web Monetization Playground - Iframe</title>

    <!-- Monetization link tags are added and removed by the parent page (wm.html). -->

    <link rel="stylesheet" href="styles.css" />

    <style>
      body {
        padding: 12px 16px;
        background-color: transparent;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      p {
        margin: 0 0 6px;
        color: var(--text-muted);
      }

      ul {
        margin: 0;
        padding-inline-start: 18px;
        font-family: var(--mono);
        font-size: 0.75rem;
        overflow-wrap: anywhere;
      }
    </style>
  </head>

  <body>
    <p>Iframe document · monetization link tags in this frame:</p>
    <ul id="tags"></ul>

    <script>
      const listEl = document.getElementById("tags");

      const render = () => {
        const links = document.head.querySelectorAll('link[rel="monetization"]');
        listEl.replaceChildren(
          ...[...links].map((link) => {
            const li = document.createElement("li");
            li.textContent = link.outerHTML;
            return li;
          }),
        );
        if (!links.length) {
          const li = document.createElement("li");
          li.textContent = "(none)";
          listEl.append(li);
        }
      };

      new MutationObserver(render).observe(document.head, {
        childList: true,
        subtree: true,
        attributes: true,
      });
      render();
    </script>
  </body>
</html>
