<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widget=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Paywall: Interledger Publisher Tools</title>

    <style>
      body {
        line-height: 1.5;
        font-family:
          Bahnschrift, "DIN Alternate", "Franklin Gothic Medium", "Nimbus Sans Narrow", sans-serif-condensed, sans-serif;
      }
    </style>

    <style>
      pre {
        white-space: pre-wrap;
        max-width: 80ch;
        background-color: light-dark(#fafafa, #333);
        padding: 0.5em;
        margin-top: -1em;
      }

      .placeholder {
        background: light-dark(#eee, #111);
        margin: 0.5em 0;
      }

      form > * {
        margin-top: 1em;
      }

      label {
        display: block;
        font-weight: bold;
      }

      form p {
        margin: 0;
      }

      form p,
      form input {
        margin-left: 1em;
      }

      form input {
        min-width: 16ch;
        field-sizing: content;
      }

      input[type="url"] {
        min-width: 32ch;
      }
    </style>

    <script src="wm-paywall.js" />
  </head>

  <body>
    <h1>Paywall: Interledger Publisher Tools</h1>
    <p>This is a test page for Interledger's Paywall publisher tool. Copied from <a href="https://test.sidvishnoi.com/web-monetization/publisher-tools/paywall.html">Sid</a>.</p>
    <p>This page injects the following script for testing purposes:</p>
    <pre id="script"></pre>

    <p>You can customize the injected script by using these URL parameters:</p>
    <form method="GET">
      <div>
        <label for="param-src">src</label>
        <p id="f-desc-src">
          Source of script: can be one of 'prod', 'staging', 'local', or a Pull Request number.
          <strong>This parameter is required.</strong>
        </p>

        <input id="param-src" name="src" list="f-datalist-src" aria-describedby="f-desc-src">
        <datalist id="f-datalist-src">
          <option value="prod">prod</option>
          <option value="staging">staging</option>
          <option value="local">local</option>
        </datalist>
      </div>

      <div>
        <label for="param-wa">wa</label>
        <p id="f-desc-wa">
          Wallet address that receives the payments. The paywall config is fetched with this wallet address as key.
        </p>

        <input id="param-wa" name="wa" type="url" aria-describedby="f-desc-wa">
      </div>

      <div>
        <label for="param-price">price</label>
        <p id="f-desc-price">
          Custom price override for current page. Overrides saved config price. Format: 1.05, 2.0, 5 etc.
        </p>

        <input
          id="param-price"
          name="price"
          type="number"
          min="0"
          step="0.01"
          inputmode="decimal"
          aria-describedby="f-desc-price"
        >
      </div>

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>

    <hr style="margin-top: 2em;">
    <p>The rest of the page content is just placeholder.</p>
    <div class="placeholder" style="width: 100%; height: 2em"></div>
    <div class="placeholder" style="width: 100%; height: 2em"></div>
    <div class="placeholder" style="width: 100%; height: 2em"></div>
    <div class="placeholder" style="width: 40%; height: 4em"></div>
    <div class="placeholder" style="width: 100%; height: 12em"></div>
    <div class="placeholder" style="width: 100%; height: 2em"></div>
    <div class="placeholder" style="width: 100%; height: 2em"></div>
    <div class="placeholder" style="width: 100%; height: 2em"></div>
    <div class="placeholder" style="width: 40%; height: 4em"></div>
    <div class="placeholder" style="width: 100%; height: 12em"></div>
  </body>
</html>
